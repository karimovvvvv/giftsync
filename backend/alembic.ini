[alembic]
# Путь к папке с миграциями
script_location = alembic

# Формат имён файлов миграций: timestamp_description.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Добавить текущую директорию в sys.path
prepend_sys_path = .

# Часовой пояс для меток времени
timezone = UTC

# URL БД — переопределяется в alembic/env.py через pydantic settings
# (это значение используется только для alembic offline-режима)
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/giftsync


[post_write_hooks]
# Хуки после генерации файла миграции (опционально)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S